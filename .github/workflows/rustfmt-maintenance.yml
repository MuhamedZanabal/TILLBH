# One-time, branch-limited repository formatting repair.
# Never runs on pull_request or main; no deployment or release authority.
name: Rustfmt maintenance branch
on:
  push:
    branches:
      - "claude/rustfmt-baseline-20261021"
    paths:
      - ".github/workflows/rustfmt-maintenance.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format and retain evidence
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --check
          git diff --stat
          git diff --binary > rustfmt.patch
      - uses: actions/upload-artifact@v4
        with:
          name: rustfmt-maintenance-patch
          path: rustfmt.patch
      - name: Commit formatting on the maintenance branch only
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "claude/rustfmt-baseline-20261021"
          if git diff --quiet -- crates src-tauri; then
            echo "No Rust formatting changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- crates src-tauri
          git commit -m "style(rust): apply cargo fmt to baseline"
          git push origin HEAD:refs/heads/claude/rustfmt-baseline-20261021
